# 本番シークレットの実値投入ドリフト定期検証（Issue #63）
#
# Secret Manager の枠は Terraform が作るが、**値（version）は tf が一切作らない**
# （google_secret_manager_secret_version はこのリポジトリの git 史上ゼロ件）。値は
# infra/README.md の §1 項目 5 で人間が out-of-band 投入するため、「枠はある・tf 成功・
# デプロイ成功・CI 全緑、しかし値がプレースホルダーのまま」という無音障害が構造的に起き得る。
# 2026-07-05〜08-02 の 4 週間、gemini-api-key が実際にこの状態で、機能A（口コミ下書き生成）は
# go-live 以降一度も成功していなかった。
#
# 静的な照合（ts-ci の check-secret-declaration-coverage.sh）は「宣言があるか」までしか
# 言えない。「宣言どおりに投入されたか」は本番を見ないと分からないため、時間で回す。
# デプロイ契機ではなく時間で回すのは、この欠陥がマージと無関係に恒常的に成り立つためである
# （#91 で学んだのと同じ理由）。
#
# CI デプロイ契約（deploy.yml / gcp-auth-smoke.yml / prod-image-drift.yml と同一・厳守）:
#   - 本ワークフローは read-only の照会のみ（gcloud secrets describe / versions list）。
#     イメージ更新も構成変更も行わない。terraform state にも触れない。
#   - **値（payload）は読まない。** CI に付くのは secret 単位の roles/secretmanager.viewer だけで、
#     このロールは secretmanager.versions.access を含まない。project 単位の付与は Req 5.4 で禁止。
#
# 必要な GitHub リポジトリ変数（vars.*・deploy.yml と共通）:
#   vars.WIF_PROVIDER   = terraform output wif_provider_name
#   vars.GCP_PROJECT_ID = gen-fw-line-meo
name: secret-version-drift

on:
  # 6 時間ごと。prod-image-drift（17 分）と同じ分にしないよう 43 分へずらす。
  # なお scheduled workflow は default branch の定義しか読まれず、リポジトリが 60 日無操作だと
  # 自動停止する。
  schedule:
    - cron: '43 */6 * * *'
  # 障害時の即時確認と、通知経路の end-to-end 実証（snapshot に fixture を渡して赤を作る）用。
  workflow_dispatch:
    inputs:
      snapshot:
        description: version 構成を注入する TSV のパス。通常は空（空なら gcloud で実測する）
        required: false
        default: ''

concurrency:
  group: secret-version-drift
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF の OIDC トークン発行に必須
  issues: write # 追跡 Issue の起票・コメント・クローズ

jobs:
  secret-drift:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout（正典は作業ツリーのファイル・git 履歴は不要）'
        uses: actions/checkout@v5
        # **fetch-depth: 0 を置かないこと。** prod-image-drift は稼働タグを commit へ解決するため
        # 全履歴を要るが、本検証は infra/secrets-provisioned.tsv と infra/*.tf を読むだけで
        # git の履歴を一切参照しない（判定は version 番号と state だけで決まる）。

      - name: 'Authenticate to Google Cloud (Direct WIF, no SA key)'
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.snapshot == ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}

      - name: 'Set up gcloud'
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.snapshot == ''
        uses: google-github-actions/setup-gcloud@v3

      - name: 'シークレット version の宣言乖離を検証（Issue #63）'
        id: secret
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          # 未入力なら空文字が入り、スクリプト側の ${VAR:-default} が既定値へ落とす。
          PROD_SECRET_SNAPSHOT: ${{ github.event.inputs.snapshot }}
        # 検証の赤はこのステップでは落とさず、通知まで通してから最終ステップで落とす。
        # continue-on-error はジョブの結論を曖昧にするので使わない。
        run: |
          set -uo pipefail
          bash scripts/check-secret-version-drift.sh > "$RUNNER_TEMP/secret-report.txt" 2>&1 && status=0 || status=$?
          cat "$RUNNER_TEMP/secret-report.txt"
          {
            echo '```'
            cat "$RUNNER_TEMP/secret-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: '追跡 Issue へ通知'
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SECRET_STATUS: ${{ steps.secret.outputs.status }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/secret-report.txt"
          if [ ! -f "$report" ]; then
            printf '%s\n' "検証ステップが report を残さずに終了しました（スクリプトの起動自体に失敗した可能性があります）。" > "$report"
          fi
          # 検証スクリプトは早期異常でも SECRET-SIGNATURE を出す契約だが、それ以前に落ちた場合
          # （プロセスが殺された等）に備えて空を許さない。空のまま渡すと状態変化の判定ができず、
          # 赤が続く限り 6 時間ごとにコメントが増える。
          sig="$(grep '^SECRET-SIGNATURE: ' "$report" | tail -n 1 | sed 's/^SECRET-SIGNATURE: //' || true)"
          if [ -z "$sig" ]; then
            sig="no-signature"
          fi
          state=red
          if [ "${SECRET_STATUS:-}" = "0" ]; then
            state=green
          fi

          body="$RUNNER_TEMP/issue-body.md"
          # 本文の組み立ては scripts/secret-version-drift-notify.sh が持つ。
          # **この run ブロックへ戻さないこと。** 戻した瞬間に「緑と赤で文面を出し分けているか」を
          # 検証する器が yml からの sed 抽出へ逆戻りし、Issue #109 と同じ形（孤児ケース検出で
          # main の ts-ci が 3 日赤）を再生産する。
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          bash scripts/secret-version-drift-notify.sh \
            --state "$state" \
            --report "$report" \
            --run-url "$run_url" > "$body"

          bash scripts/report-ci-issue.sh \
            --state "$state" \
            --label secret-version-drift \
            --title "chore(ci): 本番シークレットの version 構成が宣言と乖離しています（自動検出）" \
            --body-file "$body" \
            --signature "$sig"

      - name: '検証結果でジョブの成否を決める'
        if: always()
        env:
          SECRET_STATUS: ${{ steps.secret.outputs.status }}
        run: exit "${SECRET_STATUS:-1}"
