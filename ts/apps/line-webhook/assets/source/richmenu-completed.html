<!--
  リッチメニュー画像「completed」の焼き元（Issue #195 で新設・Issue #256 で 2 段 5 区画へ作り直し）。

  正典は隣の ../richmenu-completed.png であり、本ファイルはその出所（provenance）である。
  再現の保証ではない: フォントの描画は描画機に依存し、macOS のヒラギノと Linux の Noto では
  字形も字幅も変わるため、同じ HTML から同じ PNG は出ない。焼き直すときは macOS + Google Chrome
  で行い、焼いた PNG を目視してからコミットすること。

  焼き出し（カレントディレクトリ = ts/apps/line-webhook/assets）:
    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CHROME" --headless --disable-gpu --no-sandbox --no-first-run --disable-extensions \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=2500,1686 \
      --screenshot="richmenu-completed.png" "file://$PWD/source/richmenu-completed.html"

  制約（外すと絵が実装について嘘をつく）:
  - 寸法は 2500x1686（LINE の Full (HD)）。scripts/setup-rich-menus.ts の完了後メニューの
    寸法の宣言と一致していなければタップ座標が絵とずれる。
    test/scripts/setup-rich-menus.test.ts が実 PNG の IHDR と突き合わせて機械的に強制する。
  - 区画の割りは design.md「RichMenuDefinitions と RichMenuScripts」の区画表そのものである。
    上段 3 区画（0,0,833,843 ／ 833,0,834,843 ／ 1667,0,833,843）と
    下段 2 区画（0,843,1250,843 ／ 1250,843,1250,843）。罫線はこの境界の上にだけ引く。
    区画の割り当て（action）を絵に合わせるのはメニュー定義側の担当である。
  - 文言は要件 2.1・2.2 の 5 つの導線の語をそのまま用いる（@fwlm/line-report の REPORT_LABELS と、
    既存の「詳細を見る」「ステータス確認」）。タップして返るものと絵の文言を食い違わせない。
  - 配色は design-tokens の lineColors のみ（body #333333 / description #666666 / muted #AAAAAA）。
    アクション色の緑 (#1DB446) は使わない。5 区画はすべて押せるため、一部だけを緑にすると
    押せる区画と押せない区画があるように読まれ、全体を緑にすると面が色で埋まる
    （design-language.md 7.15: 緑は押せるものだけが持つ）。押せることは区画の割りが示す。
  - 絵文字と装飾図形を置かない（design-language.md 7.16）。階層は文字の段と区切り線だけで表す。
  - 店舗に固有の内容（店名・数値・日付）を焼き込まない。メニューは全オーナー共通である。
-->
<style>
  html,body{margin:0;padding:0;width:2500px;height:1686px;overflow:hidden}
  body{position:relative;
    background:#FFFFFF;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased}

  /* 区画。left/top/width/height は design の区画表の bounds と同じ値を書く。 */
  .cell{position:absolute;display:flex;align-items:center;justify-content:center;
    text-align:center;white-space:nowrap;letter-spacing:.01em}
  /* 上段 = 3 つのレポート。面の主役なので大きい段を持つ。 */
  .report{font-size:72px;font-weight:700;color:#333333}
  /* 下段 = 詳細画面とステータス。上段に次ぐ段として退かせる。 */
  .secondary{font-size:66px;font-weight:400;color:#666666}

  /* 区切り線。区画の境界の上に中心を置く（境界の値から線幅の半分を引いた位置に描く）。 */
  .divider{position:absolute;background:#AAAAAA}
</style>
